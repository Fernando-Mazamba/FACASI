  <rect x="926" y="20" width="62" height="580" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text transform="translate(962,598) rotate(-90)" font-size="11" font-weight="600" fill="#78350f">Serviços conformes, satisfação do cliente e cumprimento legal</text>

  <!-- ===== PROCESSOS ESTRATÉGICOS ===== -->
  <rect x="100" y="38" width="812" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="506" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">PROCESSOS ESTRATÉGICOS</text>

  <rect x="126" y="76" width="176" height="62" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="214" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Liderança</text>
  <text x="214" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">PSC-001</text>

  <rect x="318" y="76" width="176" height="62" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="406" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Gestão dos Recursos</text>
  <text x="406" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">PSC-002</text>

  <rect x="510" y="76" width="176" height="62" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
