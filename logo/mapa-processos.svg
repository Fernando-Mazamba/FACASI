<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Coluna esquerda: entradas -->
  <rect x="12" y="20" width="62" height="580" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text transform="translate(48,596) rotate(-90)" font-size="11" font-weight="600" fill="#78350f">Necessidades e expectativas das partes interessadas</text>

