  <text x="598" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">no Trabalho</text>
  <text x="598" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">PSC-004</text>

  <rect x="702" y="76" width="176" height="62" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="790" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Cumprimento e Melhoria</text>
  <text x="790" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">PCS-005</text>

  <!-- setas descendentes -->
  <path d="M250 158 L250 196" stroke="#2563eb" stroke-width="3" marker-end="url(#seta-azul)"/>
  <path d="M506 158 L506 196" stroke="#2563eb" stroke-width="3" marker-end="url(#seta-azul)"/>
  <path d="M762 158 L762 196" stroke="#2563eb" stroke-width="3" marker-end="url(#seta-azul)"/>

