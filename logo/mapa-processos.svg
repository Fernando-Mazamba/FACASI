  <path d="M78 292 L104 292" stroke="#059669" stroke-width="4" marker-end="url(#seta-verde)"/>
  <path d="M862 292 L920 292" stroke="#059669" stroke-width="4" marker-end="url(#seta-verde)"/>

  <!-- setas ascendentes de suporte -->
  <path d="M250 430 L250 392" stroke="#b91c1c" stroke-width="3" marker-end="url(#seta-vermelha)"/>
  <path d="M506 430 L506 392" stroke="#b91c1c" stroke-width="3" marker-end="url(#seta-vermelha)"/>
  <path d="M762 430 L762 392" stroke="#b91c1c" stroke-width="3" marker-end="url(#seta-vermelha)"/>

