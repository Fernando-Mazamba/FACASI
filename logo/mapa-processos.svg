  <rect x="100" y="446" width="812" height="144" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="506" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">PROCESSOS DE SUPORTE</text>

  <rect x="120" y="484" width="180" height="56" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="210" y="506" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">Gestão Documental</text>
