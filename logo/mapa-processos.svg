  <text x="506" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">PROCESSOS OPERACIONAIS — Cadeia de Valor</text>

  <!-- chevrons -->
  <g stroke="#059669" stroke-width="1.8" fill="#ecfdf5">
    <path d="M110 246 L268 246 L300 292 L268 338 L110 338 L142 292 Z"/>
    <path d="M296 246 L454 246 L486 292 L454 338 L296 338 L328 292 Z"/>
    <path d="M482 246 L640 246 L672 292 L640 338 L482 338 L514 292 Z"/>
