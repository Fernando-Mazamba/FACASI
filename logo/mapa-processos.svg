  <text x="402" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">Qualificação Técnica</text>
  <text x="402" y="535" text-anchor="middle" font-size="9.5" fill="#64748b">PSC-010 · PRO-009</text>

  <rect x="504" y="484" width="180" height="56" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="594" y="506" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">Controlo e Calibração</text>
  <text x="594" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">de Equipamentos</text>
  <text x="594" y="535" text-anchor="middle" font-size="9.5" fill="#64748b">PRO-031 (7.1.5)</text>

  <rect x="696" y="484" width="180" height="56" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="786" y="506" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">Compras, Fornecedores</text>
  <text x="786" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">e Logística</text>
  <text x="786" y="535" text-anchor="middle" font-size="9.5" fill="#64748b">PRO-016 · PSC-011 · PSC-012</text>

  <rect x="120" y="550" width="756" height="30" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="498" y="569" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">Comunicação Interna e Externa · PRO-010</text>

  <!-- retorno melhoria contínua -->
  <path d="M104 100 L94 100 L94 292" stroke="#2563eb" stroke-width="2.4" stroke-dasharray="6,4" fill="none" marker-end="url(#seta-azul)"/>

  <defs>
    <marker id="seta-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="seta-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#059669"/>
    </marker>
    <marker id="seta-vermelha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
