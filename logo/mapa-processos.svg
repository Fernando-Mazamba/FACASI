  <text x="210" y="535" text-anchor="middle" font-size="9.5" fill="#64748b">PRO-001 · PRO-002</text>

  <rect x="312" y="484" width="180" height="56" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
