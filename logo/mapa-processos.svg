  <text x="212" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Gestão do Cliente</text>
  <text x="212" y="305" text-anchor="middle" font-size="10" fill="#64748b">PRO-008 · PCS-006</text>

  <text x="392" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Análise e Desenho</text>
  <text x="392" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">do Serviço</text>
  <text x="392" y="314" text-anchor="middle" font-size="10" fill="#64748b">PSC-007</text>

  <text x="578" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Execução do Serviço</text>
  <text x="578" y="290" text-anchor="middle" font-size="10" fill="#065f46">Inspeção · END/NDT · UTM</text>
  <text x="578" y="304" text-anchor="middle" font-size="10" fill="#065f46">Manutenção · Limpeza de tanques</text>
  <text x="578" y="320" text-anchor="middle" font-size="10" fill="#64748b">PSC-008 · PRO-031</text>

  <text x="764" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Pós-venda</text>
  <text x="764" y="305" text-anchor="middle" font-size="10" fill="#64748b">PSC-009</text>

